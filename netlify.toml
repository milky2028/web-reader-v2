[build]
  command = "pnpm build"
  publish = "build"

[build.environment]
  # Node 26 "Lithium" is the Active LTS (supported until 2029-04-30). Set here, not only in
  # .nvmrc, because this overrides the Node version chosen in the Netlify dashboard.
  NODE_VERSION = "26"
  # Usage counting (src/lib/analytics.ts). Empty = off. Set to your GoatCounter site, e.g.
  # "https://<code>.goatcounter.com/count"
  VITE_GOATCOUNTER_ENDPOINT = ""

# Hashed build output never changes, so let browsers cache it forever.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
